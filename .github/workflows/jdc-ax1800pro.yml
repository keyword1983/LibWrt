name: JDCloud AX1800 Pro (jdcloud_re-ss-01) custom build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to a GitHub Release'
        required: true
        default: '0'

env:
  TZ: Asia/Taipei

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        timeout-minutes: 5
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          df -h /

      - name: Checkout source
        uses: actions/checkout@v4

      - name: apt-get update
        timeout-minutes: 5
        run: sudo apt-get update

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Fetch community packages (diy)
        run: |
          chmod +x diy-jdc.sh
          ./diy-jdc.sh

      - name: Update and install feeds
        timeout-minutes: 15
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed config
        run: |
          # luci-app-tailscale ships its own /etc/init.d/tailscale and
          # /etc/config/tailscale (more featureful than the base package's),
          # which collides with the base tailscale package's copies at
          # image-assembly time. Drop the base package's install of those
          # two files so only the LuCI app's versions end up on the image.
          sed -i \
            -e '/INSTALL_BIN.*tailscale\.init.*etc\/init\.d\/tailscale/d' \
            -e '/INSTALL_DATA.*tailscale\.conf.*etc\/config\/tailscale/d' \
            feeds/packages/net/tailscale/Makefile
          cp seed.config .config
          make defconfig

      - name: Cache build output
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: jdc-ax1800pro-custom-jdcloud_re-ss-01
          prefix: ${{ github.workspace }}

      - name: Download package sources
        timeout-minutes: 40
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        timeout-minutes: 240
        run: |
          echo "$(nproc) thread build"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Check image size
        run: |
          find bin/targets -name "*squashfs*" -exec ls -lh {} \;
          df -h

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud_re-ss-01-firmware
          path: bin/targets/**/*

      - name: Set release tag
        if: github.event.inputs.upload_release == '1'
        run: echo "RELEASE_TAG=jdc-ax1800pro-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Upload to release
        if: github.event.inputs.upload_release == '1'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bin/targets/**/*
