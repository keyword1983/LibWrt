name: JDCloud AX1800 Pro (jdcloud_re-ss-01) custom build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to a GitHub Release'
        required: true
        default: '0'

env:
  TZ: Asia/Taipei

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 20480

      - name: Checkout source
        uses: actions/checkout@v4

      - name: apt-get update
        timeout-minutes: 5
        run: sudo apt-get update

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang flex g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Fetch community packages (diy)
        run: |
          chmod +x diy-jdc.sh
          ./diy-jdc.sh

      - name: Update and install feeds
        timeout-minutes: 15
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed config
        run: |
          cp seed.config .config
          make defconfig

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir/host
          key: jdc-ax1800pro-dl-${{ hashFiles('seed.config') }}
          restore-keys: jdc-ax1800pro-dl-

      - name: Download package sources
        timeout-minutes: 20
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        timeout-minutes: 90
        run: |
          echo "$(nproc) thread build"
          make -j$(nproc) || make -j1 V=sc

      - name: Check image size
        run: |
          find bin/targets -name "*squashfs*" -exec ls -lh {} \;
          df -h

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud_re-ss-01-firmware
          path: bin/targets/**/*

      - name: Set release tag
        if: github.event.inputs.upload_release == '1'
        run: echo "RELEASE_TAG=jdc-ax1800pro-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Upload to release
        if: github.event.inputs.upload_release == '1'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bin/targets/**/*
