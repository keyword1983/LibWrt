name: JDCloud AX1800 Pro (jdcloud_re-ss-01) custom build

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload firmware to a GitHub Release'
        required: true
        default: '0'
  push:
    branches:
      - jdc-ax1800pro-custom
    tags:
      - 'v*'

env:
  TZ: Asia/Taipei

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y autoremove --purge
          sudo apt-get -y clean
          df -h /

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set release tag
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}-Arthur" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=jdc-ax1800pro-$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          fi

      - name: Use fixed apk signing key
        run: |
          # Without this, OpenWrt's build system auto-generates a fresh
          # random keypair every run, so packages built by two different
          # CI runs (or a CI run vs. the persistent dev VM) never match
          # each other's trust -- everything needs --allow-untrusted
          # forever and there's no way to mark this build's key as
          # trusted on a router once and have it stick across rebuilds.
          # Keep signing with the same keypair every time instead.
          # public-key.pem is committed in the repo (it's fine to share);
          # actions/checkout above already placed it, so only the private
          # half needs to come from a secret.
          echo "${{ secrets.APK_SIGNING_KEY }}" > private-key.pem

      - name: apt-get update
        timeout-minutes: 5
        run: sudo apt-get update

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Fetch community packages (diy)
        run: |
          chmod +x diy-jdc.sh
          ./diy-jdc.sh

      - name: Update and install feeds
        timeout-minutes: 15
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply seed config
        run: |
          # luci-app-tailscale ships its own /etc/init.d/tailscale and
          # /etc/config/tailscale (more featureful than the base package's),
          # which collides with the base tailscale package's copies at
          # image-assembly time. Drop the base package's install of those
          # two files so only the LuCI app's versions end up on the image.
          sed -i \
            -e '/INSTALL_BIN.*tailscale\.init.*etc\/init\.d\/tailscale/d' \
            -e '/INSTALL_DATA.*tailscale\.conf.*etc\/config\/tailscale/d' \
            feeds/packages/net/tailscale/Makefile
          cp seed.config .config
          make defconfig

      - name: Cache build output
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: false
          mixkey: jdc-ax1800pro-custom-jdcloud_re-ss-01
          prefix: ${{ github.workspace }}

      - name: Download package sources
        timeout-minutes: 40
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build firmware
        timeout-minutes: 240
        run: |
          echo "$(nproc) thread build"
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Check image size
        run: |
          find bin/targets -name "*squashfs*" -exec ls -lh {} \;
          df -h

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud_re-ss-01-firmware
          path: bin/targets/**/*

      - name: Build deferred packages archive
        if: github.event.inputs.upload_release == '1' || startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/deferred-packages-staging
          find bin/packages bin/targets -name "*.apk" -exec cp {} /tmp/deferred-packages-staging/ \;
          tar -czf bin/targets/qualcommax/ipq60xx/deferred-packages.tar.gz -C /tmp/deferred-packages-staging .
          rm -rf /tmp/deferred-packages-staging

      - name: Upload to release
        if: github.event.inputs.upload_release == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: bin/targets/**/*

      - name: Update deferred packages release tag
        if: github.event.inputs.upload_release == '1' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: deferred-packages-jdc-ax1800pro
          files: bin/targets/qualcommax/ipq60xx/deferred-packages.tar.gz


      - name: Publish apk repo to gh-pages
        if: github.event.inputs.upload_release == '1' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Generic (kernel-independent) packages: base/luci/packages, one
          # shared copy, always safe to overwrite wholesale.
          #
          # kmod tree: kernel-module packages carry an internal dependency
          # on the exact kernel package they were built against (apk
          # refuses to install a mismatched one -- confirmed safe, it
          # errors out rather than installing something broken). Since
          # this workflow does a full clean build every run, this run's
          # kmods and this run's firmware image always share the same
          # kernel build, so tag the kmod folder with this run's
          # RELEASE_TAG and never overwrite an older tag's folder.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages

          rm -rf /tmp/gh-pages/aarch64_cortex-a53
          cp -r bin/packages/aarch64_cortex-a53 /tmp/gh-pages/aarch64_cortex-a53
          find /tmp/gh-pages -name "packages.adb" -execdir cp packages.adb APKINDEX.tar.gz \;

          mkdir -p "/tmp/gh-pages/qualcommax/ipq60xx/${RELEASE_TAG}"
          cp bin/targets/qualcommax/ipq60xx/packages/*.apk \
             bin/targets/qualcommax/ipq60xx/packages/packages.adb \
             "/tmp/gh-pages/qualcommax/ipq60xx/${RELEASE_TAG}/"
          cat > "/tmp/gh-pages/qualcommax/ipq60xx/${RELEASE_TAG}/KERNEL.txt" << EOF
          firmware release: ${RELEASE_TAG}
          built by: GitHub Actions run ${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))

          Before installing any kmod from this folder, verify your
          router's currently-running kernel is from this same release:

              apk list --installed | grep '^kernel-'

          apk itself will refuse to install a kmod that doesn't match
          your kernel, so this is just to help you pick the right repo
          URL -- it won't let you install something broken by accident.
          EOF

          cd /tmp/gh-pages
          git add -A
          git commit -m "gh-pages: publish apk repo for ${RELEASE_TAG}" || echo "nothing to commit"
          git push origin HEAD:gh-pages

